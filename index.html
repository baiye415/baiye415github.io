<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a16">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>点击挑战</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:radial-gradient(circle at 50% 0%,#1c1142 0%,#0a0a16 62%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #app{position:fixed;inset:0;overflow:hidden}
  #fx{position:absolute;inset:0;z-index:2;pointer-events:none}
  #hud{
    position:absolute;top:0;left:0;right:0;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:16px 20px 0;
    padding-top:calc(16px + env(safe-area-inset-top));
    pointer-events:none;
  }
  .hud-box{text-align:center;min-width:70px}
  .hud-label{font-size:11px;color:#837fa6;letter-spacing:1.5px;margin-bottom:3px}
  .hud-val{
    font-size:23px;font-weight:800;color:#fff;
    font-variant-numeric:tabular-nums;
    text-shadow:0 0 14px rgba(125,249,255,.65);
    line-height:1.1;
  }
  #comboVal{color:#ffd166;text-shadow:0 0 16px rgba(255,209,102,.85)}
  #comboBox.shake{animation:shake .26s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    75%{transform:translateX(5px)}
  }
  #timeBar{
    position:absolute;top:0;left:0;right:0;height:3px;
    background:rgba(255,255,255,.07);z-index:6;pointer-events:none;
  }
  #timeFill{
    display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#7df9ff,#8b5cf6 55%,#ff2d78);
    box-shadow:0 0 12px rgba(139,92,246,.9);
  }

  /* ========== 泡泡（表情包铺满） ========== */
  .bubble{
    position:absolute;border-radius:50%;
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
    z-index:1;
    display:flex;align-items:center;justify-content:center;
    background: var(--grad);
    box-shadow:
      0 0 26px var(--glow),
      0 0 60px var(--glow);
    overflow:hidden;
    font-size: 40px;
    line-height: 1;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.35));
  }
  /* 表情包主体，铺满整个泡泡 */
  .bubble .emoji{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-size:100%;
    line-height:1;
    pointer-events:none;
    /* 稍微放大一点，让表情更"贴脸" */
    transform: scale(1.08);
    text-shadow: 0 2px 6px rgba(0,0,0,.25);
  }
  /* 保留一层高光，增强泡泡立体感 */
  .bubble::after{
    content:'';position:absolute;left:16%;top:10%;
    width:42%;height:38%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 72%);
    pointer-events:none;
    mix-blend-mode:screen;
    opacity:.9;
  }
  /* 底部阴影弧，更像球体 */
  .bubble::before{
    content:'';position:absolute;left:8%;bottom:4%;
    width:84%;height:34%;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.28),rgba(0,0,0,0) 70%);
    pointer-events:none;
  }

  .overlay{
    position:absolute;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:rgba(7,7,16,.82);
    -webkit-backdrop-filter:blur(16px);
    backdrop-filter:blur(16px);
    transition:opacity .28s ease, visibility .28s;
    overflow-y:auto;
  }
  .overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .panel{
    width:100%;max-width:352px;
    padding:32px 26px;
    text-align:center;
    border-radius:28px;
    background:linear-gradient(160deg,rgba(46,36,92,.92),rgba(16,14,34,.96));
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 26px 70px rgba(0,0,0,.7);
  }
  .panel h1{
    margin:0 0 8px;font-size:34px;letter-spacing:6px;font-weight:900;
    background:linear-gradient(115deg,#7df9ff,#c4a6ff 48%,#ff6ba6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .panel h2{
    margin:0 0 4px;font-size:22px;letter-spacing:1px;font-weight:800;
    color:#e8e6ff;
  }
  .sub{margin:0;font-size:13px;color:#9a95bd;letter-spacing:.5px}
  .rules{
    list-style:none;padding:0;margin:22px 0 0;
    text-align:left;font-size:13.5px;line-height:2;color:#b6b2d6;
  }
  .rules li::before{content:'▸';color:#8b5cf6;margin-right:9px;font-weight:900}
  .btn{
    display:block;width:100%;margin-top:20px;padding:16px;
    border:none;border-radius:17px;
    font-size:17px;font-weight:800;letter-spacing:2px;
    color:#08061a;cursor:pointer;
    background:linear-gradient(135deg,#7df9ff,#8b5cf6 55%,#ff2d78);
    box-shadow:0 10px 32px rgba(139,92,246,.5);
    transition:transform .12s ease, box-shadow .12s ease;
    font-family:inherit;
  }
  .btn:active{transform:scale(.955);box-shadow:0 4px 16px rgba(139,92,246,.45)}
  .btn.secondary{
    background:transparent;
    color:#c4a6ff;
    border:1.5px solid rgba(196,166,255,.45);
    box-shadow:none;
    margin-top:12px;
  }
  .btn.secondary:active{transform:scale(.955);background:rgba(196,166,255,.1)}
  .best{margin-top:16px;font-size:12.5px;color:#7d78a3;letter-spacing:.5px}
  .best span{color:#ffd166;font-weight:800}
  .bigScore{
    margin:14px 0 20px;
    font-size:60px;font-weight:900;line-height:1;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(180deg,#fff,#8b5cf6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(139,92,246,.7));
  }
  .stats{
    display:flex;justify-content:space-around;
    padding:16px 0;
    border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .stats div{display:flex;flex-direction:column;gap:5px}
  .stats span{font-size:11.5px;color:#837fa6;letter-spacing:.5px}
  .stats b{font-size:19px;font-weight:800;color:#e8e6ff;font-variant-numeric:tabular-nums}

  .rating-banner {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 12px 0 18px;
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 16px rgba(255,255,255,0.1);
    animation: popIn .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ===== 时间选择 ===== */
  .time-picker{
    margin: 22px 0 6px;
    text-align: center;
  }
  .time-picker-label{
    font-size: 12px;
    color: #837fa6;
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .time-options{
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .time-opt{
    flex: 1;
    padding: 14px 0;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: #b6b2d6;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: .5px;
    transition: all .18s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .time-opt .unit{
    font-size: 10px;
    font-weight: 600;
    color: #6f6a8f;
    letter-spacing: 1px;
  }
  .time-opt:active{ transform: scale(.95); }
  .time-opt.active{
    background: linear-gradient(135deg, rgba(125,249,255,.22), rgba(139,92,246,.28));
    border-color: rgba(196,166,255,.7);
    color: #fff;
    box-shadow: 0 0 22px rgba(139,92,246,.5);
    transform: translateY(-2px);
  }
  .time-opt.active .unit{ color: #c4a6ff; }

  /* ===== 暂停按钮 ===== */
  #pauseBtn{
    position:absolute;
    top:calc(14px + env(safe-area-inset-top));
    right:16px;
    z-index:8;
    width:40px;height:40px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.1);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    color:#fff;
    font-size:16px;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
    transition:transform .12s ease, background .12s ease;
  }
  #pauseBtn:active{transform:scale(.9);background:rgba(255,255,255,.2)}
  #pauseBtn.show{display:flex}

  #pauseOverlay{ z-index:30; background:rgba(7,7,16,.9); }
  #pauseOverlay .panel h2{
    font-size:26px;letter-spacing:4px;
    background:linear-gradient(115deg,#7df9ff,#c4a6ff 48%,#ff6ba6);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #pauseOverlay .sub{margin-top:6px;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <canvas id="fx"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">得分</div>
      <div class="hud-val" id="scoreVal">0</div>
    </div>
    <div class="hud-box" id="comboBox">
      <div class="hud-label">倍率</div>
      <div class="hud-val" id="comboVal">x1</div>
    </div>
    <div class="hud-box" style="margin-right:44px">
      <div class="hud-label">剩余</div>
      <div class="hud-val" id="timeVal">60</div>
    </div>
  </div>

  <div id="timeBar"><i id="timeFill"></i></div>

  <button id="pauseBtn" aria-label="暂停">⏸</button>

  <!-- 主界面 -->
  <div class="overlay" id="homeOverlay">
    <div class="panel">
      <h1>点击挑战</h1>
      <p class="sub">手速与眼力的极限挑战</p>

      <div class="time-picker">
        <div class="time-picker-label">选择挑战时长</div>
        <div class="time-options" id="timeOptions">
          <button class="time-opt" data-time="30">30<span class="unit">秒 · 疯狂</span></button>
          <button class="time-opt active" data-time="60">60<span class="unit">秒 · 标准</span></button>
          <button class="time-opt" data-time="120">120<span class="unit">秒 · 耐力</span></button>
        </div>
      </div>

      <ul class="rules">
        <li>戳破表情包泡泡得分</li>
        <li>连击提升倍率，最高 4 倍</li>
        <li>泡泡消失会断掉连击</li>
      </ul>

      <button class="btn" id="homeStartBtn">开始挑战</button>
      <div class="best">历史最高（当前时长）：<span id="bestHome">0</span></div>
    </div>
  </div>

  <!-- 暂停界面 -->
  <div class="overlay hidden" id="pauseOverlay">
    <div class="panel">
      <h2>暂停中</h2>
      <p class="sub">喘口气，随时继续</p>
      <button class="btn" id="resumeBtn">继续游戏</button>
      <button class="btn secondary" id="quitBtn">返回主界面</button>
    </div>
  </div>

  <!-- 结算界面 -->
  <div class="overlay hidden" id="endOverlay">
    <div class="panel">
      <h2 id="endTitle">时间到！</h2>
      <div class="bigScore" id="finalScore">0</div>
      <div id="ratingBanner" class="rating-banner">🥉 手残党</div>
      <div class="stats">
        <div><span>最高连击</span><b id="finalCombo">0</b></div>
        <div><span>命中</span><b id="finalHits">0</b></div>
        <div><span>命中率</span><b id="finalAcc">0%</b></div>
      </div>
      <button class="btn" id="againBtn">再来一局</button>
      <button class="btn secondary" id="homeBtn">返回主界面</button>
      <div class="best">历史最高（当前时长）：<span id="bestEnd">0</span></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ========== DOM ========== */
  const app        = document.getElementById('app');
  const canvas     = document.getElementById('fx');
  const ctx        = canvas.getContext('2d');
  const scoreVal   = document.getElementById('scoreVal');
  const comboVal   = document.getElementById('comboVal');
  const comboBox   = document.getElementById('comboBox');
  const timeVal    = document.getElementById('timeVal');
  const timeFill   = document.getElementById('timeFill');
  const homeOv     = document.getElementById('homeOverlay');
  const pauseOv    = document.getElementById('pauseOverlay');
  const endOv      = document.getElementById('endOverlay');
  const homeStartBtn = document.getElementById('homeStartBtn');
  const pauseBtn   = document.getElementById('pauseBtn');
  const resumeBtn  = document.getElementById('resumeBtn');
  const quitBtn    = document.getElementById('quitBtn');
  const againBtn   = document.getElementById('againBtn');
  const homeBtn    = document.getElementById('homeBtn');
  const bestHome   = document.getElementById('bestHome');
  const bestEnd    = document.getElementById('bestEnd');
  const finalScore = document.getElementById('finalScore');
  const finalCombo = document.getElementById('finalCombo');
  const finalHits  = document.getElementById('finalHits');
  const finalAcc   = document.getElementById('finalAcc');
  const endTitle   = document.getElementById('endTitle');
  const ratingBanner = document.getElementById('ratingBanner');
  const timeOptions  = document.getElementById('timeOptions');

  /* ========== 配置 ========== */
  const COLORS = [
    { grad:'radial-gradient(circle at 35% 30%,#ffb3d1,#ff2d78 72%)', glow:'#ff2d78', core:'#ff8ab8', emoji:'😜' },
    { grad:'radial-gradient(circle at 35% 30%,#a8e9ff,#00a6ff 72%)', glow:'#00a6ff', core:'#7fd8ff', emoji:'😎' },
    { grad:'radial-gradient(circle at 35% 30%,#b6ffd3,#00d97e 72%)', glow:'#00d97e', core:'#78ffb4', emoji:'🤪' },
    { grad:'radial-gradient(circle at 35% 30%,#ffe6a0,#ff9f1a 72%)', glow:'#ff9f1a', core:'#ffd166', emoji:'😍' },
    { grad:'radial-gradient(circle at 35% 30%,#ddc4ff,#8b5cf6 72%)', glow:'#8b5cf6', core:'#c4a6ff', emoji:'🥳' },
    { grad:'radial-gradient(circle at 35% 30%,#a8f0ff,#06b6d4 72%)', glow:'#06b6d4', core:'#7fe6f5', emoji:'🤩' },
    { grad:'radial-gradient(circle at 35% 30%,#ffd1a8,#ff6b35 72%)', glow:'#ff6b35', core:'#ffb37a', emoji:'😈' },
    { grad:'radial-gradient(circle at 35% 30%,#d1ffd8,#22c55e 72%)', glow:'#22c55e', core:'#8affa8', emoji:'🤠' },
    { grad:'radial-gradient(circle at 35% 30%,#ffc9f0,#ec4899 72%)', glow:'#ec4899', core:'#ffa6dd', emoji:'😻' },
    { grad:'radial-gradient(circle at 35% 30%,#c9e5ff,#3b82f6 72%)', glow:'#3b82f6', core:'#a6cfff', emoji:'🤑' }
  ];

  /* ========== 状态 ========== */
  let W = 0, H = 0, DPR = 1;
  let challengeTime = 60;               // 当前选择的挑战时长（秒）
  const bestMap = {};                   // 每个时长分别记录最高分

  // 载入历史最高分
  try {
    const raw = localStorage.getItem('poke_best_map');
    if (raw) Object.assign(bestMap, JSON.parse(raw));
  } catch (e) {}
  function getBest(t){ return bestMap[t] || 0; }
  function setBest(t, v){
    bestMap[t] = v;
    try { localStorage.setItem('poke_best_map', JSON.stringify(bestMap)); } catch (e) {}
  }

  const G = {
    running: false, paused: false, now: 0,
    score: 0, combo: 0, maxCombo: 0, hits: 0, misses: 0,
    timeLeft: 60, elapsed: 0, bubbles: [], spawnCooldown: 0, duration: 60
  };

  const particles = [], floats = [], shocks = [];
  const hudCache = { score: -1, combo: -1, time: -1 };

  /* ========== 尺寸自适应 ========== */
  function resize() {
    const rect = app.getBoundingClientRect();
    W = rect.width; H = rect.height;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 180));

  /* ========== 时间选择 ========== */
  timeOptions.addEventListener('click', (e) => {
    const btn = e.target.closest('.time-opt');
    if (!btn) return;
    timeOptions.querySelectorAll('.time-opt').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    challengeTime = parseInt(btn.dataset.time, 10) || 60;
    bestHome.textContent = getBest(challengeTime);
  });

  /* ========== 难度曲线（随时长缩放） ========== */
  // 基准：60 秒成长到满难度；30 秒加速成长，120 秒放缓
  function progressRatio() {
    // 已过时间占时长的比例
    return Math.min(G.elapsed / G.duration, 1);
  }
  function bubbleLife() {
    // 时长越短，基础存活时间略短一些，成长更快
    const speedFactor = 60 / G.duration;                 // 30s -> 2, 120s -> 0.5
    const base = 1.55 - 0.5 * Math.min(speedFactor - 1, 1); // 短时长略短
    const drop = 0.9 * Math.min(speedFactor, 1.6);          // 短时长掉得更快
    return Math.max(base - drop * progressRatio(), 0.5);
  }
  function maxBubbles() {
    const t = progressRatio();
    const cap = G.duration <= 30 ? 4 : G.duration >= 120 ? 5 : 4;
    return t > 0.62 ? cap : t > 0.28 ? cap - 1 : 2;
  }
  function comboMult() {
    return Math.min(1 + Math.floor(G.combo / 3) * 0.5, 4);
  }

  /* ========== 生成泡泡（表情包铺满） ========== */
  function spawnBubble(now) {
    const r = 38 + Math.random() * 14;
    const padTop = 96, padBottom = 34, padSide = r + 10;
    const availW = Math.max(W - padSide * 2, 1);
    const availH = Math.max(H - padTop - padBottom - r * 2, 1);

    const x = padSide + Math.random() * availW;
    const y = padTop + r + Math.random() * availH;
    const c = COLORS[(Math.random() * COLORS.length) | 0];

    const el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = (r * 2) + 'px';
    el.style.height = (r * 2) + 'px';
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.setProperty('--grad', c.grad);
    el.style.setProperty('--glow', c.glow);
    el.style.fontSize = (r * 2) + 'px';   // 让 emoji 自适应大小

    // 表情包铺满整张泡泡
    const face = document.createElement('div');
    face.className = 'emoji';
    face.textContent = c.emoji;
    el.appendChild(face);

    app.appendChild(el);
    G.bubbles.push({
      el, x, y, r, born: now, life: bubbleLife(), alive: true, scale: 0.6, glow: c.glow, core: c.core
    });
  }

  /* ========== 特效 ========== */
  function burst(x, y, glow, core) {
    for (let i = 0; i < 14; i++) {
      const a = (Math.PI * 2 * i) / 14 + Math.random() * 0.6;
      const sp = 90 + Math.random() * 260;
      particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.32 + Math.random() * 0.36, max: 0.68, r: 2 + Math.random() * 4.5,
        color: Math.random() < 0.5 ? core : glow
      });
    }
    shocks.push({ x, y, max: 62, life: 0.34, maxLife: 0.34, color: core });
  }

  function addFloat(x, y, text, color, size) {
    floats.push({ x, y, text, color, size: size || 17, life: 0.85, max: 0.85 });
  }

  /* ========== 点击判定 ========== */
  function onTap(e) {
    if (!G.running || G.paused) return;
    const rect = app.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;

    for (let i = G.bubbles.length - 1; i >= 0; i--) {
      const b = G.bubbles[i];
      if (!b.alive) continue;
      const d = Math.hypot(px - b.x, py - b.y);
      if (d <= b.r * b.scale + 6) {
        popBubble(b, px, py);
        return;
      }
    }
  }
  app.addEventListener('pointerdown', onTap, { passive: true });

  function popBubble(b, px, py) {
    b.alive = false;
    b.el.remove();
    const i = G.bubbles.indexOf(b);
    if (i >= 0) G.bubbles.splice(i, 1);

    G.combo++;
    G.hits++;
    if (G.combo > G.maxCombo) G.maxCombo = G.combo;

    const mult = comboMult();
    const speedBonus = Math.max(0, Math.round(6 * (1 - (G.now - b.born) / b.life)));
    const pts = Math.round((10 + speedBonus) * mult);
    G.score += pts;

    burst(px, py, b.glow, b.core);
    addFloat(px, py - 12, '+' + pts, mult > 1 ? '#ffd166' : '#ffffff');
    if (G.combo > 0 && G.combo % 5 === 0) {
      addFloat(px, py - 52, G.combo + ' 连击！', '#7df9ff', 15);
    }
    updateHUD();
  }

  function missBubble(b) {
    b.alive = false;
    b.el.remove();
    G.misses++;
    if (G.combo > 0) {
      G.combo = 0;
      comboBox.classList.remove('shake');
      void comboBox.offsetWidth;
      comboBox.classList.add('shake');
    }
  }

  /* ========== HUD ========== */
  function updateHUD() {
    if (hudCache.score !== G.score) { scoreVal.textContent = G.score; hudCache.score = G.score; }
    const mult = comboMult();
    if (hudCache.combo !== mult) { comboVal.textContent = 'x' + (mult % 1 === 0 ? mult : mult.toFixed(1)); hudCache.combo = mult; }
    const t = Math.ceil(G.timeLeft);
    if (hudCache.time !== t) { timeVal.textContent = t; hudCache.time = t; }
    timeFill.style.width = (G.timeLeft / G.duration * 100) + '%';
  }

  /* ========== 主循环 ========== */
  let lastTime = 0;
  function loop(ts) {
    const now = ts / 1000;
    let dt = lastTime ? now - lastTime : 0;
    lastTime = now;
    if (dt > 0.1) dt = 0.1;

    if (G.running && !G.paused) update(dt, now);
    if (!G.paused) renderFx(dt);
    requestAnimationFrame(loop);
  }

  function update(dt, now) {
    G.now = now; G.elapsed += dt; G.timeLeft -= dt;
    if (G.timeLeft <= 0) { G.timeLeft = 0; updateHUD(); endGame(); return; }

    G.spawnCooldown -= dt;
    if (G.spawnCooldown <= 0 && G.bubbles.length < maxBubbles()) {
      spawnBubble(now);
      G.spawnCooldown = 0.16 + Math.random() * 0.38;
    }

    for (let i = G.bubbles.length - 1; i >= 0; i--) {
      const b = G.bubbles[i];
      if (!b.alive) { G.bubbles.splice(i, 1); continue; }
      const p = (now - b.born) / b.life;
      if (p >= 1) { missBubble(b); G.bubbles.splice(i, 1); continue; }
      const grow = Math.min((now - b.born) / 0.15, 1);
      const ease = 1 - Math.pow(1 - grow, 3);
      const scale = (0.6 + 0.4 * ease) * (1 - 0.45 * p);
      b.scale = scale;
      b.el.style.transform = 'translate(-50%,-50%) scale(' + scale.toFixed(3) + ')';
      b.el.style.opacity = (1 - Math.pow(p, 3) * 0.55).toFixed(3);
    }
    updateHUD();
  }

  function renderFx(dt) {
    ctx.clearRect(0, 0, W, H);
    for (let i = shocks.length - 1; i >= 0; i--) {
      const s = shocks[i];
      s.life -= dt;
      if (s.life <= 0) { shocks.splice(i, 1); continue; }
      const p = 1 - s.life / s.maxLife;
      ctx.globalAlpha = (1 - p) * 0.75;
      ctx.strokeStyle = s.color; ctx.lineWidth = 3 * (1 - p) + 0.6;
      ctx.beginPath(); ctx.arc(s.x, s.y, 10 + p * s.max, 0, Math.PI * 2); ctx.stroke();
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 640 * dt; p.vx *= 0.97; p.vy *= 0.99;
      const a = Math.max(p.life / p.max, 0);
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life -= dt;
      if (f.life <= 0) { floats.splice(i, 1); continue; }
      f.y -= 58 * dt;
      const a = Math.min(f.life / 0.55, 1);
      ctx.globalAlpha = a;
      ctx.font = '800 ' + f.size + 'px -apple-system,"PingFang SC",sans-serif';
      ctx.shadowBlur = 14; ctx.shadowColor = f.color; ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }

  /* ========== 流程控制 ========== */
  function resetGame() {
    G.bubbles.forEach(b => b.el.remove());
    G.bubbles.length = 0; particles.length = 0; floats.length = 0; shocks.length = 0;
    G.score = 0; G.combo = 0; G.maxCombo = 0; G.hits = 0; G.misses = 0;
    G.duration = challengeTime;
    G.timeLeft = challengeTime;
    G.elapsed = 0; G.spawnCooldown = 0.35;
    G.now = performance.now() / 1000;
    G.running = true; G.paused = false;
    hudCache.score = -1; hudCache.combo = -1; hudCache.time = -1;
    updateHUD();
  }

  function startGame() {
    homeOv.classList.add('hidden');
    pauseOv.classList.add('hidden');
    endOv.classList.add('hidden');
    pauseBtn.classList.add('show');
    resize();
    resetGame();
  }

  function pauseGame() {
    if (!G.running || G.paused) return;
    G.paused = true;
    pauseOv.classList.remove('hidden');
  }

  function resumeGame() {
    if (!G.paused) return;
    G.paused = false;
    pauseOv.classList.add('hidden');
    lastTime = performance.now() / 1000;
  }

  function quitToHome() {
    G.running = false; G.paused = false;
    G.bubbles.forEach(b => b.el.remove());
    G.bubbles.length = 0; particles.length = 0; floats.length = 0; shocks.length = 0;
    pauseOv.classList.add('hidden');
    endOv.classList.add('hidden');
    pauseBtn.classList.remove('show');
    bestHome.textContent = getBest(challengeTime);
    homeOv.classList.remove('hidden');
  }

  function endGame() {
    G.running = false; G.paused = false;
    G.bubbles.forEach(b => b.el.remove());
    G.bubbles.length = 0;
    pauseBtn.classList.remove('show');

    const prevBest = getBest(G.duration);
    const isNew = G.score > prevBest;
    if (isNew) setBest(G.duration, G.score);

    finalScore.textContent = G.score;
    finalCombo.textContent = G.maxCombo;
    finalHits.textContent = G.hits;
    const total = G.hits + G.misses;
    finalAcc.textContent = total ? Math.round(G.hits / total * 100) + '%' : '0%';
    endTitle.textContent = (isNew && G.score > 0) ? '🎉 新纪录！' : '时间到！';
    bestEnd.textContent = getBest(G.duration);

    // 评价等级：按"每分钟得分率"缩放，让不同时长的评价都公平
    const perMin = G.score / (G.duration / 60);
    let rating = "", ratingColor = "", ratingBg = "";
    if (perMin < 500) {
      rating = "🥉 手残党"; ratingColor = "#a4a1c2"; ratingBg = "rgba(164,161,194,0.15)";
    } else if (perMin < 1000) {
      rating = "🥈 普通玩家"; ratingColor = "#00d97e"; ratingBg = "rgba(0,217,126,0.15)";
    } else if (perMin < 2800) {
      rating = "🥇 手速达人"; ratingColor = "#00a6ff"; ratingBg = "rgba(0,166,255,0.15)";
    } else if (perMin < 4000) {
      rating = "💎 宗师级"; ratingColor = "#8b5cf6"; ratingBg = "rgba(139,92,246,0.2)";
    } else {
      rating = "👑 传奇王者"; ratingColor = "#ffd166"; ratingBg = "rgba(255,209,102,0.2)";
    }
    ratingBanner.textContent = rating;
    ratingBanner.style.color = ratingColor;
    ratingBanner.style.background = ratingBg;
    ratingBanner.style.boxShadow = `0 0 16px ${ratingBg}`;

    endOv.classList.remove('hidden');
  }

  /* ========== 绑定 ========== */
  homeStartBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', pauseGame);
  resumeBtn.addEventListener('click', resumeGame);
  quitBtn.addEventListener('click', quitToHome);
  homeBtn.addEventListener('click', quitToHome);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && G.running) {
      if (G.paused) resumeGame(); else pauseGame();
    }
  });

  /* ========== 启动 ========== */
  bestHome.textContent = getBest(challengeTime);
  bestEnd.textContent = getBest(challengeTime);
  resize(); requestAnimationFrame(loop);
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
